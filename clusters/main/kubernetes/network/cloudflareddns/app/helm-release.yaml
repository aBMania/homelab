apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: cloudflareddns
    namespace: cloudflareddns
spec:
    interval: 5m
    chart:
        spec:
            # renovate: registryUrl=oci://oci.trueforge.org/truecharts
            chart: cloudflareddns
            version: 14.10.3
            sourceRef:
                kind: HelmRepository
                name: truecharts
                namespace: flux-system
            interval: 5m
    install:
        createNamespace: true
        crds: CreateReplace
        remediation:
            retries: 3
    upgrade:
        crds: CreateReplace
        remediation:
            retries: 3
    values:
      # Chart >= 14 (containerforge image) is configured with plain env vars; the old
      # cloudflareddns.api_token/host_zone_record values are ignored.
      workload:
        main:
          podSpec:
            containers:
              main:
                env:
                  CF_APITOKEN: ${DOMAIN_0_CLOUDFLARE_TOKEN}
                  # Only the apex A record (app hostnames are a Terraform-managed wildcard CNAME to it)
                  CF_HOSTS: ${DOMAIN_0}
                  UPDATE_IPV4: true
                  UPDATE_IPV6: false
