apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: cloudflareddns
    namespace: cloudflareddns
spec:
    interval: 5m
    chart:
        spec:
            # renovate: registryUrl=oci://oci.trueforge.org/truecharts
            chart: cloudflareddns
            version: 14.10.3
            sourceRef:
                kind: HelmRepository
                name: truecharts
                namespace: flux-system
            interval: 5m
    install:
        createNamespace: true
        crds: CreateReplace
        remediation:
            retries: 3
    upgrade:
        crds: CreateReplace
        remediation:
            retries: 3
    values:
      cloudflareddns:
        api_token: ${DOMAIN_0_CLOUDFLARE_TOKEN}
        host_zone_record:
        - domain: ${DOMAIN_0}
          record: A
          zone: ${DOMAIN_0}
