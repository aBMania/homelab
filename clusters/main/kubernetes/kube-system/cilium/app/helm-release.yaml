apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
  annotations:
    meta.helm.sh/release-name: cilium
    meta.helm.sh/release-namespace: kube-system
  labels:
    app.kubernetes.io/managed-by: Helm
spec:
  interval: 15m
  chart:
    spec:
      chart: cilium
      version: 1.20.4
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
  uninstall:
    keepHistory: false
  values:
    # autoDirectNodeRoutes: true
    # routingMode: native
    # Flow visibility for the network-policy rollout: `hubble observe --verdict DROPPED`
    # (or AUDIT while a policy runs in audit mode), and the UI at hubble. for admins
    hubble:
      enabled: true
      # The in-memory flow buffer only holds seconds here (qBittorrent traffic), so dropped flows
      # are also written to a file for `mise run net:drops` (hours of history). It lives in the
      # node's RAM-backed /var/run: kept small, and lost on reboot.
      export:
        static:
          enabled: true
          filePath: /var/run/cilium/hubble/events.log
          fileMaxSizeMb: 10
          fileMaxBackups: 3
          # Each filter is a JSON string (a Hubble FlowFilter); YAML objects crash the agent
          allowList:
            - '{"verdict":["DROPPED"]}'
          # IPv6 router solicitations on the LAN, dropped all the time and harmless
          denyList:
            - '{"protocol":["ICMPv6"]}'
        # Evidence for per-namespace ingress policies: new connections into app namespaces, read
        # with `mise run net:inbound`. Reloaded without an agent restart; a bad config is logged
        # ("Failed to parse dynamic exporter config"), not fatal. Filters are YAML FlowFilters
        # (snake_case fields; no enum fields such as verdict, they only parse as numbers).
        dynamic:
          enabled: true
          config:
            content:
              - name: inbound
                filePath: /var/run/cilium/hubble/inbound.log
                fieldMask:
                  - time
                  - source.namespace
                  - source.pod_name
                  - source.identity
                  - IP.source
                  - destination.namespace
                  - destination.pod_name
                  - l4
                  - is_reply
                includeFilters:
                  # TCP: only the opening SYN
                  - destination_pod: &appNamespaces
                      - media/
                      - panio/
                      - whosaid/
                      - jupyter/
                      - blocky/
                      - cloudflareddns/
                      - authelia/
                      - lldap/
                      - veggie-planner/
                    reply: [false]
                    tcp_flags:
                      - SYN: true
                  - destination_pod: *appNamespaces
                    reply: [false]
                    protocol: [udp]
                excludeFilters:
                  # Kubelet probes and the node: always allowed by Cilium
                  - source_label: ["reserved:host"]
                  # LAN DNS queries to Blocky: known, and most of the volume
                  - destination_pod: ["blocky/"]
                    destination_port: ["53"]
                  # Within one namespace: always allowed by the ingress policies (Authelia ↔ Redis alone
                  # filled the log in hours)
                  - {source_pod: ["media/"], destination_pod: ["media/"]}
                  - {source_pod: ["panio/"], destination_pod: ["panio/"]}
                  - {source_pod: ["whosaid/"], destination_pod: ["whosaid/"]}
                  - {source_pod: ["jupyter/"], destination_pod: ["jupyter/"]}
                  - {source_pod: ["blocky/"], destination_pod: ["blocky/"]}
                  - {source_pod: ["cloudflareddns/"], destination_pod: ["cloudflareddns/"]}
                  - {source_pod: ["authelia/"], destination_pod: ["authelia/"]}
                  - {source_pod: ["lldap/"], destination_pod: ["lldap/"]}
                  - {source_pod: ["veggie-planner/"], destination_pod: ["veggie-planner/"]}
                fileMaxSizeMb: 10
                fileMaxBackups: 5
      relay:
        enabled: true
      ui:
        enabled: true
        ingress:
          enabled: true
          annotations:
            cert-manager.io/cluster-issuer: domain-0-le-prod
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            # Without it Traefik builds the router without TLS and HTTPS requests get a 404
            traefik.ingress.kubernetes.io/router.tls: "true"
            # Authelia: only the admin rules match hubble. (default_policy deny)
            traefik.ingress.kubernetes.io/router.middlewares: traefik-auth@kubernetescrd
          hosts:
            - hubble.${DOMAIN_0}
          tls:
            - secretName: hubble-ui-tls
              hosts:
                - hubble.${DOMAIN_0}
    cluster:
      name: ${CLUSTERNAME}
      id: 1
    ipv4NativeRoutingCIDR: ${PODNET}
    securityContext:
      privileged: true
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    cgroup:
      automount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    enableRuntimeDeviceDetection: true
    endpointRoutes:
      enabled: true
    ipam:
      mode: kubernetes
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 7445
    kubeProxyReplacement: true
    kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
    localRedirectPolicy: true
    operator:
      # Single node: a 2nd replica can never schedule (hostNetwork port 9963 clash)
      replicas: 1
      rollOutPods: true
    rollOutCiliumPods: true
