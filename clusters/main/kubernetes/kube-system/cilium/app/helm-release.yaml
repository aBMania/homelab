apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
  annotations:
    meta.helm.sh/release-name: cilium
    meta.helm.sh/release-namespace: kube-system
  labels:
    app.kubernetes.io/managed-by: Helm
spec:
  interval: 15m
  chart:
    spec:
      chart: cilium
      version: 1.20.3
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
  uninstall:
    keepHistory: false
  values:
    # autoDirectNodeRoutes: true
    # routingMode: native
    # Flow visibility for the network-policy rollout: `hubble observe --verdict DROPPED`
    # (or AUDIT while a policy runs in audit mode), and the UI at hubble. for admins
    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: true
        ingress:
          enabled: true
          annotations:
            cert-manager.io/cluster-issuer: domain-0-le-prod
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            # Without it Traefik builds the router without TLS and HTTPS requests get a 404
            traefik.ingress.kubernetes.io/router.tls: "true"
            # Authelia: only the admin rules match hubble. (default_policy deny)
            traefik.ingress.kubernetes.io/router.middlewares: traefik-auth@kubernetescrd
          hosts:
            - hubble.${DOMAIN_0}
          tls:
            - secretName: hubble-ui-tls
              hosts:
                - hubble.${DOMAIN_0}
    cluster:
      name: ${CLUSTERNAME}
      id: 1
    ipv4NativeRoutingCIDR: ${PODNET}
    securityContext:
      privileged: true
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    cgroup:
      automount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    enableRuntimeDeviceDetection: true
    endpointRoutes:
      enabled: true
    ipam:
      mode: kubernetes
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 7445
    kubeProxyReplacement: true
    kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
    localRedirectPolicy: true
    operator:
      # Single node: a 2nd replica can never schedule (hostNetwork port 9963 clash)
      replicas: 1
      rollOutPods: true
    rollOutCiliumPods: true
