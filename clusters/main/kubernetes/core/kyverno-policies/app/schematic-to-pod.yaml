---
# Copies the node's Talos schematic (extensions.talos.dev/schematic) onto the
# system-upgrade-controller "apply-talos-*" pods when they are bound to a node.
# The talos upgrade plan reads it to pick the installer image (with the NVIDIA
# extensions). Without it the image is "installer/:<version>", which is invalid,
# so the upgrade fails instead of installing Talos without the driver.
# Replaces the legacy ClusterPolicy mutate-pod-binding (deprecated in Kyverno 1.19).
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: talos-schematic-to-upgrade-pod
  annotations:
    policies.kyverno.io/title: Copy Talos schematic to upgrade pods
    policies.kyverno.io/subject: Pod
spec:
  # If Kyverno is down, pods must still schedule (single node).
  failurePolicy: Ignore
  evaluation:
    admission:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods/binding"]
  matchConditions:
    - name: talos-upgrade-pods-only
      expression: object.metadata.name.startsWith("apply-talos")
  variables:
    - name: node
      expression: resource.Get("v1", "nodes", "", object.target.name)
    - name: schematic
      expression: >-
        has(variables.node.metadata.annotations) &&
        "extensions.talos.dev/schematic" in variables.node.metadata.annotations
        ? variables.node.metadata.annotations["extensions.talos.dev/schematic"]
        : "empty"
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            metadata: Object.metadata{
              annotations: {"extensions.talos.dev/schematic": variables.schematic}
            }
          }
