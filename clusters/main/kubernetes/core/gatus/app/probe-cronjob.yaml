---
# Every minute, so short VPN blackouts are seen (the flaky detector reads them)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gatus-probe-vpn
  namespace: monitoring
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 50
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: probe
              image: python:3.13.17-alpine3.24@sha256:fa0bb0d0cd7c7d6cef30a69094d32ac2b71c7304c87c6107fec100e1ee4eda02
              command: ["python", "/probe/probe.py", "vpn"]
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
              envFrom:
                # GATUS_PUSH_TOKEN, QBIT_API_KEY, *_API_KEY
                - secretRef:
                    name: alerting
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: probe
                  mountPath: /probe
          volumes:
            - name: probe
              configMap:
                name: gatus-probe
---
# Every 5 min: stalled downloads, arr download clients, requests backends
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gatus-probe
  namespace: monitoring
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 240
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: probe
              image: python:3.13.17-alpine3.24@sha256:fa0bb0d0cd7c7d6cef30a69094d32ac2b71c7304c87c6107fec100e1ee4eda02
              command: ["python", "/probe/probe.py", "all"]
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
              envFrom:
                # GATUS_PUSH_TOKEN, QBIT_API_KEY, *_API_KEY
                - secretRef:
                    name: alerting
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: probe
                  mountPath: /probe
          volumes:
            - name: probe
              configMap:
                name: gatus-probe
