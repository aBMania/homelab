---
# Dead man's switch: pings healthchecks.io every 5 min while Gatus is healthy. healthchecks.io
# alerts ntfy after 1 h without a ping (node, power, home internet or Gatus down).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gatus-heartbeat
  namespace: monitoring
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: heartbeat
              image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
              command:
                - /bin/sh
                - -c
                # Ping only while Gatus answers: a dead checker stops the heartbeat
                - >-
                  curl -fsS -m 10 -o /dev/null http://gatus.monitoring.svc:8080/health &&
                  curl -fsS -m 10 --retry 3 -o /dev/null "$HC_CLUSTER_PING_URL"
              env:
                - name: HC_CLUSTER_PING_URL
                  valueFrom:
                    secretKeyRef:
                      name: alerting
                      key: HC_CLUSTER_PING_URL
              resources:
                requests:
                  cpu: 5m
                  memory: 16Mi
                limits:
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
