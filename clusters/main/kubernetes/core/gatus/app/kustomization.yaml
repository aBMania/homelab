apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - namespace.yaml
  - alerting.secret.yaml
  - gatus-data-pvc.yaml
  - helm-release.yaml
  - heartbeat-cronjob.yaml
  - probe-cronjob.yaml
  - flaky-state-pvc.yaml
  - flaky-cronjob.yaml
configMapGenerator:
  # Hashed name, rewritten in the CronJobs: a script change applies to the next run
  - name: gatus-probe
    files:
      - probe/probe.py
  - name: gatus-flaky
    files:
      - flaky/flaky.py
