---
# Gatus's SQLite history (the flaky detector reads 6 h of it) on the SSD data disk (local-data)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gatus-data
  namespace: monitoring
  annotations:
    # keep the data if the PVC is ever removed from git (prune: true)
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-data
  resources:
    requests:
      storage: 1Gi
