apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: whosaid
    namespace: whosaid
spec:
    interval: 5m
    chart:
        spec:
            # renovate: registryUrl=https://abmania.github.io/helm-charts
            chart: whosaid-rs
            version: 0.0.6
            sourceRef:
                kind: HelmRepository
                name: abmania
                namespace: flux-system
            interval: 5m
    install:
        createNamespace: true
    values:
      # SSD Stage 2: a new instance lands on the default class local-data; then switchover and
      # back to 1 instance (single node: a second copy on the same disk protects nothing)
      cnpg:
        main:
          cluster:
            instances: 3
      workload:
        main:
          podSpec:
            containers:
              main:
                env:
                  WHOSAID_DISCORD_TOKEN: ${WHOSAID_DISCORD_TOKEN}
