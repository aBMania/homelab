apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: whosaid
    namespace: whosaid
spec:
    interval: 5m
    chart:
        spec:
            # renovate: registryUrl=https://abmania.github.io/helm-charts
            chart: whosaid-rs
            version: 0.0.6
            sourceRef:
                kind: HelmRepository
                name: abmania
                namespace: flux-system
            interval: 5m
    install:
        createNamespace: true
    values:
      # the chart (0.0.6) pins an April 2025 build on Alpine 3.21 (OpenSSL CVEs); sha-* tags are
      # immutable builds of whosaid-rs main
      image:
        repository: ghcr.io/abmania/whosaid-rs
        tag: sha-f21b411@sha256:8366eec8d4e3b904d7c7c2d4d210aeb9a0a769b7a5ff38025be2100fa2b48192
      # the DB-wait init container defaults to containerforge postgresql-client 9.6.24 (Ubuntu,
      # critical CVEs); it only needs sh + pg_isready, which the CNPG database image already has
      postgresClientImage:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: 16.15@sha256:34cd4159d07b3410a1b29da35072e2e927a0905e717a61afa3814624a2e8859a
      # SSD Stage 2: a new instance lands on the default class local-data; then switchover and
      # back to 1 instance (single node: a second copy on the same disk protects nothing)
      cnpg:
        main:
          cluster:
            instances: 1
      workload:
        main:
          podSpec:
            containers:
              main:
                env:
                  WHOSAID_DISCORD_TOKEN: ${WHOSAID_DISCORD_TOKEN}
