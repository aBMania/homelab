apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: truenas
    namespace: truenas
spec:
    interval: 5m
    chart:
        spec:
            # renovate: registryUrl=oci://oci.trueforge.org/truecharts
            chart: external-service
            version: 17.11.2
            sourceRef:
                kind: HelmRepository
                name: truecharts
                namespace: flux-system
            interval: 5m
    install:
        createNamespace: true
        crds: CreateReplace
        remediation:
            retries: 3
    upgrade:
        crds: CreateReplace
        remediation:
            retries: 3
    values:
      ingress:
        main:
          enabled: true
          integrations:
            traefik:
              enabled: true
              middlewares:
                - name: auth
                  namespace: traefik
                  # middleware lives in the traefik namespace: don't prefix it with the release name
                  expandObjectName: false
            certManager:
              enabled: true
              certificateIssuer: domain-0-le-prod
          hosts:
            - host: truenas.${DOMAIN_0}
              paths:
                - path: /
                  pathType: Prefix
      service:
        main:
          enabled: true
          # external-service >= 17 no longer derives this from protocol: https; without it Traefik
          # talks plain HTTP to the TrueNAS HTTPS port (400 "plain HTTP request sent to HTTPS port")
          annotations:
            traefik.ingress.kubernetes.io/service.serversscheme: https
          externalIP: 192.168.1.73
          ports:
            main:
              enabled: true
              port: 444
              protocol: https
