apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: panio
  namespace: panio
spec:
  interval: 5m
  chart:
    spec:
      # renovate: registryUrl=oci://ghcr.io/fait-maison/helm
      chart: panio
      version: 0.0.12
      sourceRef:
        kind: HelmRepository
        name: fait-maison
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
  # The chart has no securityContext/serviceAccount values: patch the rendered Deployment.
  # nginx starts as root (port 80, /var/cache/nginx): non-root needs an image change.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: panio
            patch: |
              - op: add
                path: /spec/template/spec/automountServiceAccountToken
                value: false
              - op: add
                path: /spec/template/spec/securityContext
                value:
                  seccompProfile:
                    type: RuntimeDefault
  values:
    ingress:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: domain-0-le-prod
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"

      hosts:
        - host: panio.${DOMAIN_0}
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: panio-tls
          hosts:
            - panio.${DOMAIN_0}
