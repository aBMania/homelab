apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: jupyter
    namespace: jupyter
spec:
    interval: 5m
    chart:
        spec:
            # renovate: registryUrl=oci://oci.trueforge.org/truecharts
            chart: jupyter
            version: 13.10.0
            sourceRef:
                kind: HelmRepository
                name: truecharts
                namespace: flux-system
            interval: 5m
    install:
        createNamespace: true
        crds: CreateReplace
        remediation:
            retries: 3
    upgrade:
        crds: CreateReplace
        remediation:
            retries: 3
    values:
      ingress:
        main:
          enabled: true
          integrations:
            traefik:
              enabled: true
              middlewares:
                - name: auth
                  namespace: traefik
                  # middleware lives in the traefik namespace: don't prefix it with the release name
                  expandObjectName: false
            certManager:
              enabled: true
              certificateIssuer: domain-0-le-prod
          hosts:
            - host: science.${DOMAIN_0}
              paths:
                - path: /
                  pathType: Prefix
      # Run the whole container as the notebook user (568), not root. The image's start script
      # only needs root to switch users; jupyter-lab already ran as 568. /home/jovyan is
      # group-writable for "users" (100), hence the supplemental group.
      securityContext:
        container:
          runAsUser: 568
          # gid 0 (root GROUP, not root user): the docker-stacks start script needs it to add
          # uid 568 to /etc/passwd when not started as root
          runAsGroup: 0
          runAsNonRoot: true
          capabilities:
            add: []
        pod:
          supplementalGroups:
            - 100
            - 568
      persistence:
        data:
          type: nfs
          path: /mnt/tank/jupyter
          server: ${NFS_HOST}
      workload:
        main:
          podSpec:
            containers:
              main:
                env:
                  NOTEBOOK_ARGS: --NotebookApp.token=''
