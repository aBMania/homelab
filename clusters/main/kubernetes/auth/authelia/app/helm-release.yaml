---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: authelia
spec:
  interval: 15m
  chart:
    spec:
      chart: authelia
      version: 34.0.9
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 5m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  # Valkey (the "redis" subchart) runs as uid 568 with group 0, which its image needs to write
  # (tested: gid 568 fails on mkdir under /opt/bitnami). The chart's common library then forces
  # runAsNonRoot false, which Pod Security "restricted" refuses; uid 568 is non-root, so say so.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: StatefulSet
              name: authelia-redis
            patch: |
              - op: test
                path: /spec/template/spec/containers/0/name
                value: authelia-redis
              - op: replace
                path: /spec/template/spec/containers/0/securityContext/runAsNonRoot
                value: true
  values:
    #        credentials:
    #            minio:
    #                type: s3
    #                url: "${S3_URL_MINIO}"
    #                bucket: "${S3_BUCKET}-authelia"
    #                accessKey: "${S3_ACCESS_KEY}"
    #                secretKey: "${S3_SECRET_KEY}"
    #                encrKey: "${S3_ENCRYPTION_KEY}"
    ingress:
      main:
        enabled: true
        integrations:
          traefik:
            enabled: true
            middlewares:
              # the login portal: per-IP rate limit on top of Authelia's per-user ban (regulation)
              - name: ratelimit
                namespace: traefik
                # middleware lives in the traefik namespace: don't prefix it with the release name
                expandObjectName: false
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
        hosts:
          - host: auth.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
    cnpg:
      main:
        cluster:
          instances: 1
          singleNode: true
    persistence:
      config:
        enabled: true
        type: pvc
        existingClaim: authelia-data
    workload:
      main:
        replicas: 1
        podSpec:
          containers:
            main:
              env:
                AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_KEY}
                AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_JWT_KEY}
                AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_ENCRYPTION_KEY}
    authelia:
      theme: auto
      totp:
        issuer: ${DOMAIN_0}
      authentication_backend:
        # Users' LLDAP mail addresses aren't real inboxes: the reset link would go nowhere (or to the admin).
        # Passwords are reset by the admin in LLDAP instead.
        password_reset:
          disable: true
        ldap:
          address: ldap://lldap-ldap.lldap.svc.cluster.local:3890
          tls:
            server_name: lldap.${DOMAIN_0}
          base_dn: DC=${DN},DC=${DC}
          attributes:
            username: uid
          additional_users_dn: ou=people
          users_filter: (&(|({username_attribute}={input})({mail_attribute}={input}))(objectClass=person))
          additional_groups_dn: ou=groups
          groups_filter: (member={dn})
          user: uid=admin,ou=people,dc=${DN},dc=${DC}
          password: ${LLDAP_PASSWORD}
      access_control:
        # Anything not matched below is refused (the chart default would be one_factor = any user, any app)
        default_policy: deny
        networks:
          - name: lan
            networks:
              - 192.168.0.0/16
        # First matching rule wins
        rules:
          # Jupyter (runs code): science group password-only at home, password + TOTP from outside.
          # Admins fall through to the admin rules below (same split).
          - domain:
              - "science.${DOMAIN_0}"
            policy: one_factor
            subject: group:science
            networks:
              - lan
          - domain:
              - "science.${DOMAIN_0}"
            policy: two_factor
            subject: group:science
          # Jellyseerr: any LLDAP user, password only
          - domain:
              - "requests.${DOMAIN_0}"
            policy: one_factor
          # Support: password only, Radarr/Sonarr (admins match the rules below)
          - domain:
              - "radarr.${DOMAIN_0}"
              - "sonarr.${DOMAIN_0}"
            policy: one_factor
            subject: group:support
          # Family: password only, subtitles
          - domain:
              - "subtitles.${DOMAIN_0}"
            policy: one_factor
            subject: group:user
          # Status page (Gatus, read-only): open at home, any user's password from outside.
          # Before the admin rules, which would ask for a login at home and refuse other users.
          - domain:
              - "status.${DOMAIN_0}"
            policy: bypass
            networks:
              - lan
          - domain:
              - "status.${DOMAIN_0}"
            policy: one_factor
          # Admins at home: password only
          - domain:
              - ${DOMAIN_0}
              - '*.${DOMAIN_0}'
            policy: one_factor
            subject: group:admin
            networks:
              - lan
          # Admins from outside: password + TOTP
          - domain:
              - ${DOMAIN_0}
              - '*.${DOMAIN_0}'
            policy: two_factor
            subject: group:admin
      session:
        cookies:
          - domain: '${DOMAIN_0}'
            authelia_url: 'https://auth.${DOMAIN_0}'
            default_redirection_url: 'https://www.${DOMAIN_0}'
      regulation:
        find_time: 10m
        ban_time: 12h
      notifier:
        smtp:
          address: 'smtp://${SMTP_HOST}:587'
          username: ${SMTP_USER}
          password: ${SMTP_PASSWORD}
          sender: auth@${DOMAIN_0}
          startup_check_address: auth@${DOMAIN_0}
          disable_html_emails: true
          tls:
            server_name: ${SMTP_HOST}
