apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: sonarr
    namespace: media
spec:
    interval: 5m
    chart:
        spec:
            # renovate: registryUrl=oci://oci.trueforge.org/truecharts
            chart: sonarr
            version: 26.10.4
            sourceRef:
                kind: HelmRepository
                name: truecharts
                namespace: flux-system
            interval: 5m
    install:
        createNamespace: true
        crds: CreateReplace
        remediation:
            retries: 3
    upgrade:
        crds: CreateReplace
        remediation:
            retries: 3
    values:
      ingress:
        main:
          enabled: true
          integrations:
            traefik:
              enabled: true
              middlewares:
                - name: auth
                  namespace: traefik
                  # middleware lives in the traefik namespace: don't prefix it with the release name
                  expandObjectName: false
            certManager:
              enabled: true
              certificateIssuer: domain-0-le-prod
          hosts:
            - host: tvshows.${DOMAIN_0}
              paths:
                - path: /
                  pathType: Prefix
      persistence:
        # PVC sonarr-data on the SSD data disk (local-data, sonarr-data-pvc.yaml): SQLite WAL freezes on NFS
        config:
          enabled: true
          type: pvc
          existingClaim: sonarr-data
        media:
          enabled: true
          type: nfs
          path: /mnt/tank/media
          mountPath: /media
          server: ${NFS_HOST}
