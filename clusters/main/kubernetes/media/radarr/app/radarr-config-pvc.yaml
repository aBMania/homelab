---
# radarr's /config (SQLite in WAL mode) on Longhorn instead of NFS: on NFS radarr froze for
# more than 75 s and got liveness-killed (899 failures / 17 restarts in 9 days).
# See docs/superpowers/plans/2026-10-17-app-config-storage.md (Task 1).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-config
  namespace: media
  annotations:
    # keep the data if the PVC is ever removed from git (prune: true)
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
