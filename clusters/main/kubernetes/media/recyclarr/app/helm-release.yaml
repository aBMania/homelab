apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: recyclarr
    namespace: media
spec:
    interval: 5m
    chart:
        spec:
            # renovate: registryUrl=oci://oci.trueforge.org/truecharts
            chart: recyclarr
            version: 15.12.1
            sourceRef:
                kind: HelmRepository
                name: truecharts
                namespace: flux-system
            interval: 5m
    install:
        createNamespace: true
        crds: CreateReplace
        remediation:
            retries: 3
    upgrade:
        crds: CreateReplace
        remediation:
            retries: 3
    values:
      persistence:
        config:
          enabled: true
          type: pvc
          existingClaim: recyclarr-data
        # recyclarr-configs.yaml (git); the old NFS recyclarr.yml was renamed to .bak
        recyclarr-configs:
          enabled: true
          type: configmap
          objectName: recyclarr-configs
          expandObjectName: false
          mountPath: /config/configs
          readOnly: true
      workload:
        main:
          podSpec:
            initContainers:
              initconfig:
                enabled: false
            containers:
              main:
                # RADARR_API_KEY / SONARR_API_KEY / RADARR_4K_API_KEY, read with !env_var
                envFrom:
                  - secretRef:
                      name: decluttarr-secret
                      expandObjectName: false
                  - secretRef:
                      name: radarr-4k-secret
                      expandObjectName: false
