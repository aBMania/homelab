---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: decluttarr
  namespace: media
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      # Doesn't use the Kubernetes API
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    controllers:
      decluttarr:
        containers:
          app:
            image:
              repository: ghcr.io/manimatter/decluttarr
              tag: v2.2.0@sha256:fd3dc206c17df32190cda1bed2ef3ee1cb9726bd108aa7e97e83e47cb3e72d78
            envFrom:
              # SONARR_API_KEY, RADARR_API_KEY, QBITTORRENT_API_KEY
              - secretRef:
                  name: decluttarr-secret
              # RADARR_4K_API_KEY
              - secretRef:
                  name: radarr-4k-secret
            env:
              TZ: Europe/Paris
              LOG_LEVEL: INFO
              # Live since 2026-10-08 (test-run logs reviewed)
              TEST_RUN: "False"
              # Check every 10 min; a download is removed after 36 strikes in a row (~6h)
              TIMER: "10"
              # Frees qBittorrent queue slots held by dead torrents, blocklists the
              # release in Sonarr/Radarr and triggers a new search
              REMOVE_STALLED: |
                max_strikes: 36
              REMOVE_METADATA_MISSING: |
                max_strikes: 36
              REMOVE_FAILED_DOWNLOADS: "True"
              # Only imports that are useless anyway (a better/same file is already in
              # the library) or fake releases carrying malware (.exe/.lnk flagged by the
              # *arrs); other failures are left for manual review
              REMOVE_FAILED_IMPORTS: |
                message_patterns:
                  - "Not an upgrade for existing*"
                  - "*already imported at*"
                  - "Episode file on disk contains more episodes than this file contains"
                  - "Caution: Found*"
              # Private trackers count a deleted download as a hit-and-run and the ratio
              # suffers: their downloads leave the *arr queue (new search) but stay in
              # qBittorrent to keep seeding (2026-10-20: 2 finished private downloads deleted)
              PRIVATE_TRACKER_HANDLING: remove_from_queue
              # $(VAR) is expanded by Kubernetes from the envFrom secret above
              SONARR: |
                - base_url: "http://sonarr.media.svc.cluster.local:8989"
                  api_key: "$(SONARR_API_KEY)"
              RADARR: |
                - base_url: "http://radarr.media.svc.cluster.local:7878"
                  api_key: "$(RADARR_API_KEY)"
                - base_url: "http://radarr-4k.media.svc.cluster.local:7878"
                  api_key: "$(RADARR_4K_API_KEY)"
              # Needed to tell private torrents apart. One entry per download-client name used in
              # the *arrs (Sonarr calls it "qtb", the Radarrs "qbt"); same qBittorrent behind both
              QBITTORRENT: |
                - base_url: "http://qbittorrent.media.svc.cluster.local:10095"
                  name: "qtb"
                  api_key: "$(QBITTORRENT_API_KEY)"
                - base_url: "http://qbittorrent.media.svc.cluster.local:10095"
                  name: "qbt"
                  api_key: "$(QBITTORRENT_API_KEY)"
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    persistence:
      # It writes its log file to ./logs, which non-root can't create in the image
      logs:
        type: emptyDir
        globalMounts:
          - path: /app/logs
