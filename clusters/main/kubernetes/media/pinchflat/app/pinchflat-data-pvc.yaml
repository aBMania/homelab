---
# pinchflat's data on the SSD data disk (local-data). See docs/superpowers/plans/2026-10-18-ssd-stage2.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pinchflat-data
  namespace: media
  annotations:
    # keep the data if the PVC is ever removed from git (prune: true)
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-data
  resources:
    requests:
      storage: 1Gi
