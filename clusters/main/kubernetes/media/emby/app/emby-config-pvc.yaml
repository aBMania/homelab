---
# Emby's /config (library.db, users, watched states, metadata) on Longhorn instead of NFS:
# SQLite in WAL mode froze on NFS while Emby bulk-deleted items and it got liveness-killed
# (2026-10-17). /config/sync (20 GB of converted copies) stays on NFS, see helmrelease.yaml.
# See docs/superpowers/plans/2026-10-17-app-config-storage.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: emby-config
  namespace: media
  annotations:
    # keep the data if the PVC is ever removed from git (prune: true)
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
