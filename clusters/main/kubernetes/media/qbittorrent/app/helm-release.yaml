apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
  namespace: media
spec:
  interval: 5m
  chart:
    spec:
      # renovate: registryUrl=oci://oci.trueforge.org/truecharts
      chart: qbittorrent
      version: 25.11.2
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    portal:
      open:
        enabled: false
    ingress:
      main:
        enabled: true
        integrations:
          traefik:
            enabled: true
            middlewares:
              - name: local
                namespace: traefik
                expandObjectName: false
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
        hosts:
          - host: torrent.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
    configmap:
      gluetun-scripts:
        enabled: true
        data:
          # gluetun control server (port 8000, reachable from the cluster) auth: only the
          # read-only forwarded-port route used by the liveness probe is open; every other
          # route (e.g. stopping the VPN) is denied. Newer gluetun denies all routes unless
          # a role allows them.
          auth.toml: |
            [[roles]]
            name = "liveness-probe"
            routes = ["GET /v1/portforward"]
            auth = "none"
          # Share limits (public trackers only): a torrent is STOPPED at ratio 2 or after 1 year
          # of seeding (525600 min; max_ratio_act 0 = stop). Radarr/Sonarr ("Remove Completed")
          # then delete it with its files, after import. Removing it here (max_ratio_act 3)
          # could delete a torrent before it's imported, and the *arrs warn about it.
          # Imported media stays in the library (hardlinks), only the torrent copy goes.
          # Run by gluetun each time it gets a forwarded port: sets the port and
          # (re)applies the qBittorrent settings that keep the VPN tunnel stable.
          # Without limits/queueing, qBittorrent opens so many new connections
          # that ProtonVPN drops all new flows for 30s-2min (tunnel "blackouts").
          # Torrents under 2 KiB/s for 60 s (dead or seedless grabs) don't hold one of the 10 download
          # slots (2026-10-20: half the slots sat on 0-seed torrents). max_connec still caps the
          # connections; watch for ProtonVPN blackouts since more torrents are active at once.
          # Never download files that no real movie/episode release contains: fake releases ship a
          # ~1 GB .iso or an .exe/.lnk in place of the video (2026-10-20: 7 fake .iso "episodes").
          # One pattern per line ("\n" inside the JSON string; the file is sent with spaces stripped).
          # Upload is capped at 1 MB/s (alt speed) from 06:00 to 23:00 UTC so seeding
          # doesn't saturate the home uplink; full 6 MB/s overnight.
          # Default share limit (public trackers): ratio 2 or 14 days of seeding, then the torrent
          # stops and the *arrs remove it, so finished torrents cycle out of the 25 upload slots.
          # Private trackers set their own limits per torrent (Prowlarr seed settings).
          qbt-up.sh: |
            #!/bin/sh
            cat > /tmp/qbt-prefs.json <<EOF
            {
              "listen_port": $1, "random_port": false, "upnp": false,
              "max_connec": 300, "max_connec_per_torrent": 30, "max_uploads": 60,
              "connection_speed": 10, "max_concurrent_http_announces": 10,
              "dl_limit": 25000000, "up_limit": 6000000,
              "alt_dl_limit": 25000000, "alt_up_limit": 1000000,
              "scheduler_enabled": true, "scheduler_days": 0,
              "schedule_from_hour": 6, "schedule_from_min": 0,
              "schedule_to_hour": 23, "schedule_to_min": 0,
              "limit_tcp_overhead": true,
              "queueing_enabled": true, "max_active_downloads": 10,
              "max_active_uploads": 25, "max_active_torrents": 35,
              "dont_count_slow_torrents": true,
              "excluded_file_names_enabled": true,
              "excluded_file_names": "*.iso\n*.exe\n*.scr\n*.lnk\n*.bat\n*.cmd\n*.msi\n*.zipx",
              "max_ratio_enabled": true, "max_ratio": 2,
              "max_seeding_time_enabled": true, "max_seeding_time": 20160,
              "max_ratio_act": 0
            }
            EOF
            wget -qO- --retry-connrefused --tries=30 \
              --post-data "json=$(tr -d '\n ' < /tmp/qbt-prefs.json)" \
              http://127.0.0.1:10095/api/v2/app/setPreferences
      private-seed:
        enabled: true
        data:
          # Private trackers count upload, public ones don't. Every 60 s:
          # - force-start finished private torrents, so they never wait in the 25-slot
          #   seeding queue (2026-10-20: private torrents queued behind public seeds were
          #   removed after 7 days without uploading, and the ratio went negative);
          # - while a private torrent has a connected leecher or is downloading, cap every
          #   public torrent at 8 KiB/s so the private one gets the upload (global caps:
          #   1 MB/s by day, 6 MB/s at night). The caps are lifted 10 min after that demand
          #   stops (a leecher dropping in and out doesn't flip ~500 limits every minute).
          # Only seeding torrents are force-started: setForceStart also resumes a stopped one,
          # so torrents stopped by hand, in error or missing files are left alone.
          # Logs counts only (torrent names are media titles).
          private_seed.py: |
            import json, time, urllib.parse, urllib.request
            API = 'http://127.0.0.1:10095/api/v2/'
            PUBLIC_LIMIT = 8 * 1024
            HOLD = 600
            DEMAND_STATES = ('downloading', 'forcedDL')
            SEEDING_STATES = ('uploading', 'stalledUP', 'queuedUP')
            last_demand = float('-inf')

            def call(path, data=None):
                body = urllib.parse.urlencode(data).encode() if data else None
                with urllib.request.urlopen(API + path, body, timeout=30) as r:
                    return r.read()

            def tick():
                global last_demand
                ts = json.loads(call('torrents/info'))
                private = [t for t in ts if t.get('private')]
                public = [t for t in ts if t.get('private') is False]
                force = [t['hash'] for t in private
                         if t['state'] in SEEDING_STATES and t['progress'] == 1 and not t['force_start']]
                if force:
                    call('torrents/setForceStart', {'hashes': '|'.join(force), 'value': 'true'})
                demand = [t for t in private if t['num_leechs'] > 0 or t['state'] in DEMAND_STATES]
                if demand:
                    last_demand = time.monotonic()
                if time.monotonic() - last_demand < HOLD:
                    todo = [t['hash'] for t in public if t['up_limit'] <= 0]
                    limit = PUBLIC_LIMIT
                else:
                    todo = [t['hash'] for t in public if t['up_limit'] == PUBLIC_LIMIT]
                    limit = 0
                if todo:
                    call('torrents/setUploadLimit', {'hashes': '|'.join(todo), 'limit': limit})
                if force or todo:
                    print(f'private={len(private)} demand={len(demand)} force-started={len(force)} '
                          f'public {"capped" if limit else "uncapped"}={len(todo)}', flush=True)

            while True:
                try:
                    tick()
                except Exception as e:  # qBittorrent restarting, VPN reconnect...
                    print(f'error: {type(e).__name__}: {e}', flush=True)
                time.sleep(60)
    persistence:
      private-seed:
        enabled: true
        type: configmap
        objectName: private-seed
        targetSelector:
          main:
            private-seed:
              mountPath: /private-seed
      gluetun-scripts:
        enabled: true
        type: configmap
        objectName: gluetun-scripts
        defaultMode: "0755"
        targetSelector:
          main:
            gluetun:
              mountPath: /scripts
      config:
        enabled: true
        type: pvc
        existingClaim: qbittorrent-data
      media:
        enabled: true
        type: nfs
        path: /mnt/tank/media
        mountPath: /media
        server: ${NFS_HOST}
    workload:
      main:
        podSpec:
          containers:
            # Upload priority for private torrents: see configmap private-seed.
            # Same image as qBittorrent (it ships python3); talks to the WebUI on
            # localhost, which qBittorrent lets in without a login.
            private-seed:
              enabled: true
              primary: false
              imageSelector: image
              command:
                - python3
                - -u
                - /private-seed/private_seed.py
              probes:
                liveness:
                  enabled: false
                readiness:
                  enabled: false
                startup:
                  enabled: false
              resources:
                requests:
                  cpu: 5m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
    # Chart default (tccr mirror) is still v3.40.0
    gluetunImage:
      repository: ghcr.io/qdm12/gluetun
      tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    addons:
      gluetun:
        enabled: true
        container:
          # Restart gluetun if it hangs (it froze for 2 months) or if port
          # forwarding stays dead (v3.41.3 never retries a failed first attempt)
          probes:
            liveness:
              enabled: true
              type: exec
              command:
                - /bin/sh
                - -c
                - /gluetun-entrypoint healthcheck && wget -qO- http://127.0.0.1:8000/v1/portforward | grep -q '"port":[1-9]'
              spec:
                initialDelaySeconds: 120
                periodSeconds: 30
                timeoutSeconds: 10
                failureThreshold: 8
          # A restarted gluetun container finds its old routing rule still in the
          # shared pod network namespace and crash-loops on "file exists"
          lifecycle:
            postStart:
              type: exec
              command:
                - /bin/sh
                - -c
                - (ip rule del table 51820; ip -6 rule del table 51820) || true
          env:
            FIREWALL: "on"
            # Not needed: lets qBittorrent reach the LAN outside the VPN, but nothing
            # uses it (NFS volumes are mounted by the node; WebUI/*arr traffic uses
            # the pod/service CIDRs, which the chart always allows). Kept here as
            # the correct LAN value in case direct LAN access is ever needed.
            # FIREWALL_OUTBOUND_SUBNETS: "192.168.1.0/24"
            VPN_SERVICE_PROVIDER: "${VPN_SERVICE_PROVIDER}"
            VPN_TYPE: "wireguard"
            WIREGUARD_PRIVATE_KEY: "${WIREGUARD_PRIVATE_KEY}"
            SERVER_COUNTRIES: "${SERVER_COUNTRIES}"
            PORT_FORWARD_ONLY: "on"
            VPN_PORT_FORWARDING: "on"
            HTTP_CONTROL_SERVER_AUTH_CONFIG_FILEPATH: "/scripts/auth.toml"
            VPN_PORT_FORWARDING_UP_COMMAND: "/bin/sh /scripts/qbt-up.sh {{`{{PORT}}`}}"
