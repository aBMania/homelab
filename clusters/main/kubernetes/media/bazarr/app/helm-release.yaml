apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: bazarr
    namespace: media
spec:
    interval: 5m
    chart:
        spec:
            # renovate: registryUrl=oci://oci.trueforge.org/truecharts
            chart: bazarr
            version: 24.11.2
            sourceRef:
                kind: HelmRepository
                name: truecharts
                namespace: flux-system
            interval: 5m
    install:
        createNamespace: true
        crds: CreateReplace
        remediation:
            retries: 3
    # bazarr's first start after a major update (DB migration, SQLite on NFS) can exceed the
    # default 5m; a rollback then leaves an old version that can't read the migrated DB.
    timeout: 20m
    upgrade:
        crds: CreateReplace
        remediation:
            retries: 3
            remediateLastFailure: false
    values:
      workload:
        main:
          podSpec:
            containers:
              main:
                probes:
                  startup:
                    spec:
                      timeoutSeconds: 10
                      failureThreshold: 180
      ingress:
        main:
          enabled: true
          integrations:
            traefik:
              enabled: true
              middlewares:
                - name: auth
                  namespace: traefik
            certManager:
              enabled: true
              certificateIssuer: domain-0-le-prod
          hosts:
            - host: subtitles.${DOMAIN_0}
              paths:
                - path: /
                  pathType: Prefix
      persistence:
        config:
          enabled: true
          type: nfs
          path: /mnt/tank/apps/bazarr
          server: ${NFS_HOST}
        media:
          enabled: true
          type: nfs
          path: /mnt/tank/media
          mountPath: /media
          server: ${NFS_HOST}
