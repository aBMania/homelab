---
# jellyseerr's /config (SQLite in WAL mode) on Longhorn instead of NFS (no freezes yet, but the same SQLite WAL on NFS).
# See docs/superpowers/plans/2026-10-17-app-config-storage.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyseerr-config
  namespace: media
  annotations:
    # keep the data if the PVC is ever removed from git (prune: true)
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
