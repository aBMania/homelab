apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: jellyseerr
    namespace: media
spec:
    interval: 5m
    chart:
        spec:
            # renovate: registryUrl=oci://oci.trueforge.org/truecharts
            chart: jellyseerr
            version: 16.0.0
            sourceRef:
                kind: HelmRepository
                name: truecharts
                namespace: flux-system
            interval: 5m
    install:
        createNamespace: true
        crds: CreateReplace
        remediation:
            retries: 3
    upgrade:
        crds: CreateReplace
        remediation:
            retries: 3
    values:
      ingress:
        main:
          enabled: true
          integrations:
            traefik:
              enabled: true
              middlewares:
                - name: auth
                  namespace: traefik
                  # middleware lives in the traefik namespace: don't prefix it with the release name
                  expandObjectName: false
            certManager:
              enabled: true
              certificateIssuer: domain-0-le-prod
          hosts:
            - host: requests.${DOMAIN_0}
              paths:
                - path: /
                  pathType: Prefix
      persistence:
        # Longhorn PVC (jellyseerr-config-pvc.yaml): SQLite WAL freezes on NFS. The old NFS data in
        # /mnt/tank/apps/jellyseerr is kept untouched as the rollback copy (storage plan).
        config:
          enabled: true
          type: pvc
          existingClaim: jellyseerr-data
