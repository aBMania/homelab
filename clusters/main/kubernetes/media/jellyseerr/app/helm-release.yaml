apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: jellyseerr
    namespace: media
spec:
    interval: 5m
    chart:
        spec:
            # renovate: registryUrl=oci://oci.trueforge.org/truecharts
            chart: seerr
            version: 17.0.6
            sourceRef:
                kind: HelmRepository
                name: truecharts
                namespace: flux-system
            interval: 5m
    install:
        createNamespace: true
        crds: CreateReplace
        remediation:
            retries: 3
    upgrade:
        crds: CreateReplace
        remediation:
            retries: 3
    values:
      ingress:
        main:
          enabled: true
          integrations:
            traefik:
              enabled: true
              middlewares:
                - name: auth
                  namespace: traefik
                  # middleware lives in the traefik namespace: don't prefix it with the release name
                  expandObjectName: false
            certManager:
              enabled: true
              certificateIssuer: domain-0-le-prod
          hosts:
            - host: requests.${DOMAIN_0}
              paths:
                - path: /
                  pathType: Prefix
      persistence:
        # PVC jellyseerr-data on the SSD data disk (local-data, jellyseerr-data-pvc.yaml): SQLite WAL freezes on NFS
        config:
          enabled: true
          type: pvc
          existingClaim: jellyseerr-data
      # Jellyseerr became Seerr (3.x, migrates the 2.x SQLite DB on first start). The seerr
      # chart defaults to Postgres (CNPG): keep the existing SQLite DB on the PVC instead.
      cnpg:
        main:
          enabled: false
      workload:
        main:
          podSpec:
            containers:
              main:
                env:
                  DB_TYPE: sqlite
                  DB_HOST: null
                  DB_PORT: null
                  DB_USER: null
                  DB_PASS: null
                  DB_NAME: null
                  DB_LOG_QUERIES: null
