apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 5m
  chart:
    spec:
      # Upstream jetstack chart (the TrueCharts cert-manager chart is archived).
      # Upgrade one cert-manager minor at a time.
      chart: cert-manager
      version: v1.17.4
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Same object names/selectors as the former TrueCharts release (in-place switch)
    nameOverride: certmanager
    fullnameOverride: cert-manager-certmanager
    crds:
      enabled: true
      keep: true
    # Flags the TrueCharts chart set: verify DNS01 challenges via public resolvers
    # (the cluster's own DNS can answer differently), and own secrets by certificates
    enableCertificateOwnerRef: true
    dns01RecursiveNameservers: "1.1.1.1:53,1.0.0.1:53"
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
    startupapicheck:
      enabled: false
