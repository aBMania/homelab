# Default StorageClass: hostpath volumes on the Talos data disk (zvol tank2/talos-data, user
# volume `data` at /var/mnt/data). Retain: deleting a PVC never deletes app data.
# See docs/superpowers/specs/2026-10-18-ssd-storage-design.md (Stage 2).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-data
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
    openebs.io/cas-type: local
    cas.openebs.io/config: |
      - name: StorageType
        value: hostpath
      - name: BasePath
        value: /var/mnt/data/openebs
provisioner: openebs.io/local
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
