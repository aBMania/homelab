# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-crds
  namespace: system
spec:
  interval: 15m
  chart:
    spec:
      # renovate: registryUrl=https://traefik.github.io/charts
      chart: traefik-crds
      version: 1.18.0
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  # Upstream chart (the TrueCharts one is archived). Same release name, so the CRDs are updated
  # in place. It drops the Gateway API (v1.1.0) and Traefik Hub CRDs the TrueCharts chart also
  # shipped: nothing uses them (0 objects, Cilium's Gateway API is off).
  values:
    traefik: true
    gatewayAPI: false
    hub: false
    # adds helm.sh/resource-policy: keep, so removing this release never deletes the CRDs
    deleteOnUninstall: false
