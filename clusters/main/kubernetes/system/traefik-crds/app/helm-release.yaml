# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-crds
  namespace: system
spec:
  interval: 15m
  chart:
    spec:
      chart: traefik-crds
      version: 3.5.1
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  # Being retired: the upstream traefik chart (network/traefik) will ship the CRDs itself.
  # The upstream traefik-crds chart can't replace this one: it bundles every optional CRD set
  # (Gateway API is 2.3 MB), so its Helm release record exceeds the 1 MiB Secret limit.
  # keep: removing this release later must not delete the CRDs (and every Middleware with them).
  values: { }
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: CustomResourceDefinition
            patch: |
              - op: add
                path: /metadata/annotations/helm.sh~1resource-policy
                value: keep
