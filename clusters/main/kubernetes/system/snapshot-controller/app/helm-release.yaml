apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
  namespace: snapshot-controller
spec:
  interval: 5m
  chart:
    spec:
      chart: snapshot-controller
      version: 3.8.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3
  values:
    podOptions:
      # Chart >= 3.7.3 defaults to user namespaces (hostUsers: false), which
      # Talos disables (user.max_user_namespaces=0): pods fail with
      # "failed to start noop process for unshare: no space left on device"
      hostUsers: true
