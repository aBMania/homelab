apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
  namespace: volsync
spec:
  interval: 5m
  chart:
    spec:
      chart: volsync
      version: 4.11.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    podOptions:
      # Newer TrueCharts common defaults to user namespaces (hostUsers: false), which Talos
      # disables (user.max_user_namespaces=0): pods would fail with ENOSPC on unshare
      hostUsers: true
