clusterName: ${CLUSTERNAME}
# renovate: datasource=docker depName=ghcr.io/siderolabs/installer
# Config *contract* version for talhelper, not the installed Talos version (that one is TALOS_VERSION in
# flux-system/flux/upgradesettings.yaml, currently v1.14.2). Talos 1.14 accepts this 1.13-style config.
# Moving to v1.14 here makes talhelper emit the new multi-document Kube*/Resolver configs, which conflict
# with patches/{controlplane,network}.yaml: migrate those patches first (separate task).
talosVersion: v1.13.11
# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
kubernetesVersion: v1.36.5
endpoint: https://${VIP}:6443
allowSchedulingOnControlPlanes: true
additionalMachineCertSans:
  - 127.0.0.1
  - ${VIP}
additionalApiServerCertSans:
  - 127.0.0.1
  - ${VIP}
# Warning: Also used in Cilium CNI values!
clusterPodNets:
  - ${PODNET}
clusterSvcNets:
  - ${SVCNET}
cniConfig:
  name: none
patches:
  - '@./patches/all.yaml'
  - '@./patches/install.yaml'
nodes:
  # We would adivce to always stick to a "k8s-something-1" style naming scheme
  - hostname: k8s-control-1
    ipAddress: ${MASTER1IP}
    controlPlane: true
    installDiskSelector:
      size: <= 1600GB
    schematic:
      customization:
        extraKernelArgs:
          - net.ifnames=0
        systemExtensions:
          officialExtensions:
            - siderolabs/util-linux-tools
            - siderolabs/iscsi-tools
            - siderolabs/qemu-guest-agent
            - siderolabs/nonfree-kmod-nvidia-lts
            - siderolabs/nvidia-container-toolkit-lts
    patches:
      - "@./patches/nvidia.yaml"
      - "@./patches/network.yaml"
controlPlane:
  patches:
    - '@./patches/controlplane.yaml'
  machineFiles:
    - content: |
        [plugins."io.containerd.grpc.v1.cri"]
          enable_unprivileged_ports = true
          enable_unprivileged_icmp = true
        [plugins."io.containerd.grpc.v1.cri".containerd]
          discard_unpacked_layers = false
        [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
          discard_unpacked_layers = false
      permissions: 0
      path: /etc/cri/conf.d/20-customization.part
      op: create
    - content: |
        [ NFSMount_Global_Options ]
        nfsvers=4.2
        hard=True
        noatime=True
        nodiratime=True
        rsize=131072
        wsize=131072
        nconnect=8
      permissions: 420
      path: /etc/nfsmount.conf
      op: overwrite

worker:
  patches:
    - '@./patches/worker.yaml'
  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/util-linux-tools
          - siderolabs/iscsi-tools
          - siderolabs/qemu-guest-agent
  machineFiles:
    - content: |
        [plugins."io.containerd.grpc.v1.cri"]
          enable_unprivileged_ports = true
          enable_unprivileged_icmp = true
        [plugins."io.containerd.grpc.v1.cri".containerd]
          discard_unpacked_layers = false
        [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
          discard_unpacked_layers = false
      permissions: 0
      path: /etc/cri/conf.d/20-customization.part
      op: create
    - content: |
        [ NFSMount_Global_Options ]
        nfsvers=4.2
        hard=True
        noatime=True
        nodiratime=True
        rsize=131072
        wsize=131072
        nconnect=8
      permissions: 420
      path: /etc/nfsmount.conf
      op: overwrite
