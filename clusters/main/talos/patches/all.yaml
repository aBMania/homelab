# Talos machine config patch (strategic merge). Merged into the generated config by talhelper.
# tccr.io mirror is REQUIRED: traefik, nextcloud and db-wait images still reference tccr.io and pull via quay.io.
# kubelet shutdown grace: Postgres/Longhorn need more than the old 15s/10s to stop cleanly.
# sysctls: bigger socket buffers for the WireGuard/QUIC traffic of gluetun, inotify limits for file-watching apps.
machine:
  time:
    disabled: false
    servers:
    - time.cloudflare.com
  kubelet:
    extraArgs:
      rotate-server-certificates: true
    extraConfig:
      maxPods: 250
      shutdownGracePeriod: 120s
      shutdownGracePeriodCriticalPods: 30s
    extraMounts:
    - destination: /var/openebs/local
      type: bind
      source: /var/openebs/local
      options:
      - bind
      - rshared
      - rw
    - destination: /var/lib/longhorn
      type: bind
      source: /var/lib/longhorn
      options:
      - bind
      - rshared
      - rw
  features:
    hostDNS:
      enabled: true
      resolveMemberNames: true
      forwardKubeDNSToHost: false
  registries:
    mirrors:
      cgr.dev:
        endpoints:
        - https://cgr.dev
      docker.io:
        endpoints:
        - https://mirror.gcr.io
        - https://registry-1.docker.io
        - https://docker.io
      registry-1.docker.io:
        endpoints:
        - https://mirror.gcr.io
        - https://registry-1.docker.io
      ghcr.io:
        endpoints:
        - https://ghcr.io
      quay.io:
        endpoints:
        - https://quay.io
      mcr.microsoft.com:
        endpoints:
        - https://mcr.microsoft.com
      public.ecr.aws:
        endpoints:
        - https://public.ecr.aws
      gcr.io:
        endpoints:
        - https://gcr.io
      registry.k8s.io:
        endpoints:
        - https://registry.k8s.io
      factory.talos.dev:
        endpoints:
        - https://factory.talos.dev
      tccr.io:
        endpoints:
        - https://quay.io
        - https://tccr.io
  sysctls:
    fs.inotify.max_queued_events: '65536'
    fs.inotify.max_user_instances: '8192'
    fs.inotify.max_user_watches: '524288'
    net.core.rmem_max: '2500000'
    net.core.wmem_max: '2500000'
cluster:
  proxy:
    disabled: true
