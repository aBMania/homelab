# Talos machine config patch (strategic merge). Merged into the generated config by talhelper.
cluster:
  controllerManager:
    extraArgs:
      bind-address: 0.0.0.0
  scheduler:
    extraArgs:
      bind-address: 0.0.0.0
  apiServer:
    admissionControl:
    - name: PodSecurity
      configuration:
        apiVersion: pod-security.admission.config.k8s.io/v1alpha1
        defaults:
          audit: restricted
          audit-version: latest
          enforce: baseline
          enforce-version: latest
          warn: restricted
          warn-version: latest
        exemptions:
          namespaces:
          - metallb
          - metallb-config
          - topolvm-system
          - longhorn-system
          - kyverno
          - system-upgrade
          - openebs
          - snapshot-controller
          - volsync
          - flux-system
          runtimeClasses: []
          usernames: []
        kind: PodSecurityConfiguration
machine:
  features:
    kubernetesTalosAPIAccess:
      enabled: true
      allowedRoles:
      - os:admin
      allowedKubernetesNamespaces:
      - system-upgrade
