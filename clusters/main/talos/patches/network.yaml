# Talos machine config patch (strategic merge). Merged into the generated config by talhelper.
# Network kept in the legacy v1alpha1 format, exactly as the node runs it today. talhelper's
# networkInterfaces would emit the Talos 1.13 multi-document format (LinkConfig, Layer2VIPConfig,
# ResolverConfig), which needs a reboot to switch. Migrate deliberately, with console access.
machine:
  network:
    interfaces:
      - interface: eth0
        addresses:
          - ${MASTER1IP}/24
        routes:
          - network: 0.0.0.0/0
            gateway: ${GATEWAY}
        vip:
          ip: ${VIP}
      # Private NFS link to TrueNAS (bridge br2, no physical port): TrueNAS is 10.30.0.1.
      # Selected by MAC (pinned on the TrueNAS VM device) so it never takes eth0's place.
      - deviceSelector:
          hardwareAddr: "00:a0:98:9b:00:2b"
        addresses:
          - 10.30.0.2/30
    nameservers:
      - 1.1.1.1
      - 8.8.8.8
